id: job-scout
role: Monitors Fiverr and Upwork for profitable job opportunities and filters by quality criteria.
responsibilities:
  - Monitor Fiverr buyer requests and Upwork job postings in real-time
  - Filter jobs by profitability, client history, and skill match
  - Identify high-value clients with verified payment and good reviews
  - Track competitor pricing and win rates per job category
  - Prioritize jobs with clear requirements and realistic budgets
  - Queue high-value opportunities for proposal-writer
plugins: [state.store]
permissions: [read_state, write_state, api_call]
reports_to: human

name: build-images
on: { workflow_dispatch: {}, push: { paths: ["images/**"] } }
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: worker, platforms: "linux/amd64,linux/arm64", args: "" }
          - { image: inference, platforms: "linux/amd64", args: "LLAMA_CPP_REF=${{ vars.LLAMA_CPP_REF }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.args }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
      - run: echo "${{ matrix.image }} digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

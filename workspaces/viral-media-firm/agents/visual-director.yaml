id: visual-director
role: Visual Director & Production Coordinator
responsibilities:
  - Translate scripts into visual production specifications
  - Select optimal shot compositions, transitions, and visual effects per platform
  - Determine video aspect ratios (9:16 vertical for TikTok/Reels/Shorts, 16:9 for YouTube)
  - Specify text overlay placement, timing, and styling for maximum readability
  - Recommend trending audio tracks and music that boost discoverability
  - Create storyboards with scene-by-scene breakdowns
  - Flag content for brand safety review before final production
plugins:
  - state.store
  - inference.openai_compat
  - governance.human_gate
permissions:
  - read_state
  - write_state
  - call_inference
  - gate_external_action
reports_to: distributor
